# /etc/apache2/sites-available/ubuntu-ls.conf
# VirtualHost configuration for <your-subdomain>.<your-domain>.com
# Proxies requests to local FastAPI/Uvicorn backend running on 127.0.0.1:8005

<VirtualHost *:80>
    ServerName <your-subdomain>.<your-domain>.com

    ServerAdmin webmaster@<your-domain>.com
    DocumentRoot /var/www/ubuntu-ls/frontend/dist

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Proxy Configuration
    ProxyPreserveHost On
    ProxyRequests Off

    # Stream endpoints (SSE / Server-Sent Events): flush packets immediately
    ProxyPass /api/metrics/stream http://127.0.0.1:8005/api/metrics/stream flushpackets=on
    ProxyPassReverse /api/metrics/stream http://127.0.0.1:8005/api/metrics/stream

    ProxyPass /api/logs/ http://127.0.0.1:8005/api/logs/ flushpackets=on
    ProxyPassReverse /api/logs/ http://127.0.0.1:8005/api/logs/

    # Default API and Static Proxy
    ProxyPass /api/ http://127.0.0.1:8005/api/
    ProxyPassReverse /api/ http://127.0.0.1:8005/api/

    # Serve built SPA frontend directly or fallback to backend
    ProxyPass / http://127.0.0.1:8005/
    ProxyPassReverse / http://127.0.0.1:8005/

    ErrorLog ${APACHE_LOG_DIR}/ubuntu-ls_error.log
    CustomLog ${APACHE_LOG_DIR}/ubuntu-ls_access.log combined
</VirtualHost>
